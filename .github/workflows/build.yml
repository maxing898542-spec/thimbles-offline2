name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libunwind-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libssl-dev autoconf automake libtool pkg-config cmake zip unzip python3-setuptools

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "buildozer>=1.5.0" "Cython==0.29.36" virtualenv

      - name: Install legacy commandlinetools for sdkmanager
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"
          curl -sS -O https://google.com
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p tools/bin
          cp -r cmdline-tools/bin/* tools/bin/
          cp -r cmdline-tools/lib tools/
          yes | tools/bin/sdkmanager --sdk_root="$SDK_DIR" --licenses || true

      - name: Build APK with Buildozer
        env:
          CFLAGS: "-Wno-incompatible-function-pointer-types -Wno-implicit-function-declaration -Wno-int-conversion"
          TARGET_CFLAGS: "-Wno-incompatible-function-pointer-types -Wno-implicit-function-declaration -Wno-int-conversion"
        run: |
          buildozer -v android debug --arch=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thimbles-offline-apk
          path: bin/*.apk
          retention-days: 14

